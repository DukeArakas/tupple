<aside class="dashboard-sidebar">
    <div class="sidebar-user">
        <img src="{{ current_user.avatar_url() }}" alt="{{ current_user.username }}" class="sidebar-avatar">
        <div class="sidebar-user-info">
            <h3>{{ current_user.username }}</h3>
            <span>{{ current_user.email }}</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}" class="sidebar-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
        </a>
        <a href="{{ url_for('playlists') }}" class="sidebar-link {% if request.endpoint in ['playlists', 'playlist_detail'] %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            My Playlists
        </a>
        <a href="{{ url_for('watch_history') }}" class="sidebar-link {% if request.endpoint == 'watch_history' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Watch History
        </a>
        <a href="{{ url_for('liked_videos') }}" class="sidebar-link {% if request.endpoint == 'liked_videos' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </svg>
            Liked Videos
        </a>
