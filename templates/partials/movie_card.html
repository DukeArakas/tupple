<div class="card movie-card">
    <a href="{{ url_for('movie_detail', movie_id=movie.id) }}" class="card-link">
        <div class="card-image">
            <img src="{{ movie.cover_url() }}" alt="{{ movie.title }}" loading="lazy">
            <div class="card-overlay">
                <div class="play-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
            </div>
            <div class="card-badges">
                {% if movie.year %}
                    <span class="badge">{{ movie.year }}</span>
                {% endif %}
                {% if movie.rating %}
                    <span class="badge badge-rating">{{ "%.1f"|format(movie.rating) }}</span>
                {% endif %}
            </div>
        </div>
        <div class="card-body">
            <h3 class="card-title">{{ movie.title }}</h3>
            <div class="card-meta">
                {% if movie.category %}<span>{{ movie.category.name }}</span>{% endif %}
                {% if movie.duration %}<span>{{ movie.duration }} min</span>{% endif %}
            </div>
        </div>
    </a>
</div>
