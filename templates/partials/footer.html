<footer class="footer">
    <div class="footer-container">
        <div class="footer-brand">
            <a href="{{ url_for('index') }}" class="footer-logo">
                <span class="logo-text">Tupple</span>
            </a>
            <p class="footer-tagline">Movies & Anime. Watch. Download. Curate.</p>
        </div>
        <div class="footer-links">
            <div class="footer-col">
                <h4>Browse</h4>
                <a href="{{ url_for('category_page', slug='action') }}">Action</a>
                <a href="{{ url_for('category_page', slug='sci-fi') }}">Sci-Fi</a>
                <a href="{{ url_for('category_page', slug='horror') }}">Horror</a>
                <a href="{{ url_for('category_page', slug='anime') }}">Anime</a>
            </div>
            <div class="footer-col">
                <h4>Account</h4>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a href="{{ url_for('playlists') }}">Playlists</a>
                    <a href="{{ url_for('watch_history') }}">History</a>
                    <a href="{{ url_for('user_settings') }}">Settings</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Sign In</a>
                    <a href="{{ url_for('register') }}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; {{ now.year if now else '2026' }} Tupple. All rights reserved.</p>
    </div>
</footer>
